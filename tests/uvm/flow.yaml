# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# Side-by-side (`*-eq`) benches, as fw-i2c: picorv32 (ref-rtl) and the class
# model behind pins (spl-rtl) in one top, each with its own WB memory loaded
# from the same hex, RVFI records compared in order (tb/hdl_top_eq.sv).
#   dfm run wb-eq-smoke   tests/sw/smoke.hex on the `wb` view vs picorv32.
#   dfm run wb-eq-<prog>  same for alu, mem, branch, trap-misaligned, trap-illegal
#                         (programs from tests/sw/asm.py); wb-eq-all runs all six.
#   dfm run rtl-eq-<prog> the same programs on the `rtl` view (lowered netlist,
#                         module fw_picorv32_top, same pins); rtl-eq-all runs all six.
fragment:
  tasks:
  - { name: view-src-wb-eq, passthrough: all, consumes: none, needs: [spl-rtl, ref-rtl] }
  - { name: view-src-rtl-eq, passthrough: all, consumes: none, needs: [rtl, ref-rtl] }

  - name: eq-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - tb/wb_mem.sv
      - tb/hdl_top_eq.sv

  - name: wb-eq-img
    uses: hdlsim.vlt.SimImage
    needs: [view-src-wb-eq, eq-tb]
    with:
      top: [hdl_top_eq]

  - root: wb-eq-smoke
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/smoke.hex"]

  - root: wb-eq-alu
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/alu.hex"]

  - root: wb-eq-mem
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/mem.hex"]

  - root: wb-eq-branch
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/branch.hex"]

  - root: wb-eq-trap-misaligned
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/trap-misaligned.hex"]

  - root: wb-eq-trap-illegal
    uses: hdlsim.vlt.SimRun
    needs: [wb-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/trap-illegal.hex"]

  - root: wb-eq-all
    passthrough: all
    consumes: none
    needs: [wb-eq-smoke, wb-eq-alu, wb-eq-mem, wb-eq-branch, wb-eq-trap-misaligned, wb-eq-trap-illegal]

  - name: rtl-eq-img
    uses: hdlsim.vlt.SimImage
    needs: [view-src-rtl-eq, eq-tb]
    with:
      top: [hdl_top_eq]

  - root: rtl-eq-smoke
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/smoke.hex"]

  - root: rtl-eq-alu
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/alu.hex"]

  - root: rtl-eq-mem
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/mem.hex"]

  - root: rtl-eq-branch
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/branch.hex"]

  - root: rtl-eq-trap-misaligned
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/trap-misaligned.hex"]

  - root: rtl-eq-trap-illegal
    uses: hdlsim.vlt.SimRun
    needs: [rtl-eq-img]
    with:
      plusargs: ["hex=${{ rootdir }}/tests/sw/trap-illegal.hex"]

  - root: rtl-eq-all
    passthrough: all
    consumes: none
    needs: [rtl-eq-smoke, rtl-eq-alu, rtl-eq-mem, rtl-eq-branch, rtl-eq-trap-misaligned, rtl-eq-trap-illegal]
