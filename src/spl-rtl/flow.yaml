# fw-picorv32 behind picorv32_ref's pins.
#   spl-rtl   fw_picorv32_top around the class model (`spl`). For simulation.
#   lowered   the same design lowered to a Verilog netlist (module
#             fw_picorv32_top, same pins).
#   rtl       the lowered netlist: the design sources of the `rtl` view.
fragment:
  tasks:
  - name: fw-picorv32-top
    uses: std.FileSet
    needs: [spl]
    with:
      type: systemVerilogSource
      include:
      - fw_picorv32_xtor_if.sv
      - fw_picorv32_spl_rtl_pkg.sv
      - fw_picorv32_top.sv

  - export: spl-rtl
    uses: std.FileSet
    needs: [fw-picorv32-top]

  - export: lowered
    uses: fw.hdl.lower.Lower
    needs: [fw-picorv32-top]
    with:
      top: fw_picorv32_top
      module: fw_picorv32_top
      # each process as clocked blocks in its source's structure. seqcorr
      # (SAT induction over the netlist) runs for over 15 minutes on this
      # core, so it is off.
      options: emit=structured,seqcorr=0

  - export: rtl
    uses: std.FileSet
    needs: [lowered]
